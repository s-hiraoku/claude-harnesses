name: Validate plugins

on:
  pull_request:
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - "schemas/**"
      - "scripts/validate-plugins.sh"
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - "schemas/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install jsonschema==4.25.1

      - run: bash scripts/validate-plugins.sh
