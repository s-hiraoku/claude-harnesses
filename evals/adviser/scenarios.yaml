# Evaluation scenarios for adviser
#
# Edit this file to define 2–3 realistic scenarios with a frozen requirements
# checklist per scenario. Tag at least one item per scenario as `[critical]`.
# Once a run has been recorded against this file, treat the checklists as
# immutable — moving them after the fact destroys the metric.
#
# Schema:
#   skill: string                     # name of the skill under evaluation
#   scenarios:
#     - id: string                    # short slug
#       kind: typical | edge
#       prompt: string                # what to hand the subagent verbatim
#       requirements:
#         - text: string              # one human-readable requirement
#           critical: bool            # default false; >=1 must be true
# ---

skill: adviser

scenarios:
  - id: typical
    kind: typical
    prompt: |
      The native Advisor tool is unavailable. You have inspected the middleware and tests for a multi-file authentication refactor but have not edited anything. Apply the adviser skill and explain the next workflow without changing files or launching another agent.
    requirements:
      - text: It selects the fallback only because native Advisor is unavailable and prefers an Opus general-purpose Task reviewer.
        critical: true
      - text: It consults after orientation and before committing to the approach using a bounded, secret-free consultation brief.
        critical: true
      - text: It keeps all execution, edits, evidence checks, and decisions in the main agent.
        critical: false
      - text: It schedules a fresh completion consultation after durable changes and verification.
        critical: false

  - id: edge
    kind: edge
    prompt: |
      The native Advisor tool is unavailable. A command has just printed the exact replacement for a wrong one-line configuration value, so the next edit is mechanical. Explain whether to launch the fallback adviser without changing files.
    requirements:
      - text: It skips a ritual consultation for the short reactive step.
        critical: true
      - text: It preserves consultation for later ambiguity, repeated failure, or a material direction change.
        critical: false
      - text: It does not claim that native Advisor, Opus, or any independent reviewer ran.
        critical: false
